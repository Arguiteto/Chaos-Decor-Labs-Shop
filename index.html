<!doctype html>
<!--
  CHAOS DECOS LABS — TELA "EM BREVE"
  ───────────────────────────────────
  Página única e autossuficiente: todo o CSS está aqui dentro, não há
  JavaScript e não há link para nenhuma outra página.

  É de propósito. Enquanto a loja não abre, ESTE é o único arquivo que
  fica no servidor. Assim não existe loja escondida atrás de uma cortina
  para alguém tentar burlar — simplesmente não há o que burlar.

  O site completo fica guardado com você, fora do ar, até a hora de abrir.

  O QUE MEXER AQUI:
  · o @ e o link do Instagram
  · o texto do aviso
  · as cores, no bloco :root logo abaixo
-->
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Em breve — Chaos Decos Labs</title>
  <meta name="description" content="Chaos Decos Labs — objetos de decoração impressos em 3D. A loja está chegando; acompanhe as novidades no Instagram." />
  <meta name="theme-color" content="#F0E4D0" />
  <meta property="og:title" content="Chaos Decos Labs — Em breve" />
  <meta property="og:description" content="Objetos de decoração impressos em 3D, feitos sob encomenda. Acompanhe no Instagram." />
  <meta property="og:type" content="website" />
  <style>
:root{
  --red:#C1392B;
  --navy:#1B396B;
  --mustard:#E9A11B;
  --green:#4E7A3F;
  --cream:#F0E4D0;
  --ink:#1A1A1A;
  --line: rgba(27,57,107,.16);
  --muted: rgba(26,26,26,.58);
  --edge: clamp(18px, 3.2vw, 44px);
  --content: 1360px;
  /* ── TIPOGRAFIA: uma família só, dois pesos ────────────────
     Helvetica não se baixa da web (é licenciada), então a pilha
     abaixo pega a que a máquina tiver, na ordem:
       Helvetica Neue / Helvetica → Mac e iPhone (a de verdade)
       Arial                      → Windows (mesmas medidas)
       Liberation / Nimbus Sans   → Linux (clones métricos)
     Como todas têm a mesma métrica, o layout não muda de máquina
     pra máquina — só o desenho da letra, e bem pouco.
     Sem webfont: o site não depende de nada externo pra carregar. */
  --font-display: 'Helvetica Neue', Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', sans-serif;
  --font-body: 'Helvetica Neue', Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', sans-serif;
}

*{ box-sizing:border-box; }

body{
  margin:0;
  background:var(--cream);
  color:var(--ink);
  font-family:var(--font-body);
  overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
}

a{ color:inherit; text-decoration:none; }

.brand-mark{ position:relative; width:34px; height:34px; flex:0 0 auto; }
.brand-mark span{ position:absolute; display:block; }
.brand-mark .m1{ width:22px; height:22px; border-radius:50%; background:var(--red); top:0; left:0; }
.brand-mark .m2{ width:16px; height:16px; background:var(--navy); right:0; bottom:0; }
.brand-name{
/* ── 16. TELA DE ESPERA (em-breve.html) ────────────────────── */
body.tela-espera{
  min-height:100dvh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:clamp(24px, 4vh, 48px);
  padding:clamp(28px, 5vw, 60px);
  position:relative;
  overflow:hidden;
  text-align:center;
}

/* Formas geométricas ao fundo, bem atrás do texto */
.espera-arte{
  position:absolute;
  inset:0;
  overflow:hidden;
  pointer-events:none;
  z-index:0;
}
.espera-arte .forma{ position:absolute; display:block; }

.circulo-grande{
  width:clamp(280px, 42vw, 620px);
  aspect-ratio:1;
  border-radius:50%;
  background:var(--navy);
  top:-14%;
  left:-12%;
}
.quadrado{
  width:clamp(120px, 16vw, 240px);
  aspect-ratio:1;
  background:var(--red);
  right:-4%;
  top:12%;
}
.meia-lua{
  width:clamp(180px, 26vw, 380px);
  aspect-ratio:1;
  background:var(--mustard);
  border-radius:50% 50% 50% 0;
  right:-8%;
  bottom:-10%;
}
.triangulo{
  width:clamp(90px, 12vw, 180px);
  aspect-ratio:1;
  background:var(--green);
  clip-path:polygon(50% 0, 100% 100%, 0 100%);
  left:8%;
  bottom:6%;
}
.circulo-pequeno{
  width:clamp(70px, 9vw, 130px);
  aspect-ratio:1;
  border-radius:50%;
  background:var(--mustard);
  left:34%;
  top:8%;
}

.espera-conteudo{
  position:relative;
  z-index:1;
  max-width:560px;
  background:rgba(240,228,208,.9);
  backdrop-filter:blur(10px);
  padding:clamp(28px, 5vw, 52px) clamp(22px, 5vw, 56px);
  border-radius:24px;
}

.espera-marca{
  display:inline-flex;
  align-items:center;
  gap:10px;
  margin:0 0 clamp(18px, 3vh, 30px);
  font-weight:700;
  font-size:12.5px;
  letter-spacing:.16em;
  text-transform:uppercase;
  color:var(--ink);
}

.espera-titulo{
  margin:0;
  font-family:var(--font-display);
  font-weight:700;
  font-size:clamp(44px, 11vw, 88px);
  line-height:.95;
  letter-spacing:-0.04em;
  color:var(--navy);
}

.espera-texto{
  margin:clamp(14px, 2.5vh, 22px) auto 0;
  max-width:38ch;
  font-size:clamp(14px, 1.6vw, 16px);
  line-height:1.7;
  color:var(--muted);
}

.espera-botao{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:10px;
  margin-top:clamp(22px, 4vh, 34px);
  min-height:54px;
  padding:0 26px;
  border-radius:999px;
  background:var(--red);
  color:var(--cream);
  font-weight:700;
  font-size:13px;
  letter-spacing:.08em;
  text-transform:uppercase;
  transition:transform .18s ease, background .18s ease;
}
.espera-botao:hover{ transform:translateY(-2px); background:var(--navy); }

.espera-icone{ width:20px; height:20px; display:inline-grid; place-items:center; }
.espera-icone svg{
  width:100%; height:100%;
  fill:none; stroke:currentColor; stroke-width:1.6;
  stroke-linecap:round; stroke-linejoin:round;
}

.espera-arroba{
  margin:12px 0 0;
  font-size:12.5px;
  letter-spacing:.06em;
  color:var(--muted);
}

@media (max-width:520px){
  .espera-conteudo{ border-radius:18px; }
  .circulo-pequeno{ display:none; }
}

  </style>
</head>
<body class="tela-espera">

<div class="espera-arte" aria-hidden="true">
    <span class="forma circulo-grande"></span>
    <span class="forma quadrado"></span>
    <span class="forma meia-lua"></span>
    <span class="forma triangulo"></span>
    <span class="forma circulo-pequeno"></span>
  </div>

  <main class="espera-conteudo">
    <p class="espera-marca">
      <span class="brand-mark"><span class="m1"></span><span class="m2"></span></span>
      Chaos Decos Labs
    </p>

    <h1 class="espera-titulo">Em breve</h1>

    <p class="espera-texto">
      Objetos de decoração impressos em 3D, feitos sob encomenda.
      A loja está sendo preparada.
    </p>

    <a class="espera-botao"
       href="https://www.instagram.com/chaos_decorlabs/"
       target="_blank" rel="noopener">
      <span class="espera-icone" aria-hidden="true">
        <svg viewBox="0 0 24 24">
          <rect x="3" y="3" width="18" height="18" rx="5"/>
          <circle cx="12" cy="12" r="4"/>
          <circle cx="17.2" cy="6.8" r="1.1" fill="currentColor" stroke="none"/>
        </svg>
      </span>
      Novidades no Instagram
    </a>

    <p class="espera-arroba">@chaos_decorlabs</p>
  </main>

</body>
</html>
