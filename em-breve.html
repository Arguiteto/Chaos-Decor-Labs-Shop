<!doctype html>
<!--
  CHAOS DECOS LABS — TELA DE ESPERA
  ──────────────────────────────────
  A única página que o visitante vê enquanto SITE_BLOQUEADO estiver
  true (ver chaos-config.js). Sem menu, sem carrinho, sem preço:
  só a marca, o aviso e o caminho para o Instagram.

  Ela não carrega o chaos-dados.js de propósito — não precisa do
  catálogo, e assim abre instantaneamente.

  O QUE MEXER AQUI:
  · o link do Instagram, se mudar o @
  · o texto do aviso
  · as cores vêm do chaos-loja.css, como no resto do site
-->
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Em breve — Chaos Decos Labs</title>
  <meta name="description" content="Chaos Decos Labs — objetos de decoração impressos em 3D. A loja está chegando; acompanhe as novidades no Instagram." />
  <meta name="theme-color" content="#F0E4D0" />
  <script src="chaos-config.js"></script>
  <link rel="stylesheet" href="chaos-loja.css">
</head>
<body class="tela-espera">

  <!-- Composição geométrica de fundo: as mesmas formas primárias
       das artes dos produtos, em escala de página inteira. -->
  <div class="espera-arte" aria-hidden="true">
    <span class="forma circulo-grande"></span>
    <span class="forma quadrado"></span>
    <span class="forma meia-lua"></span>
    <span class="forma triangulo"></span>
    <span class="forma circulo-pequeno"></span>
  </div>

  <main class="espera-conteudo">
    <p class="espera-marca">
      <span class="brand-mark"><span class="m1"></span><span class="m2"></span></span>
      Chaos Decos Labs
    </p>

    <h1 class="espera-titulo">Em breve</h1>

    <p class="espera-texto">
      Objetos de decoração impressos em 3D, feitos sob encomenda.
      A loja está sendo preparada.
    </p>

    <a class="espera-botao"
       href="https://www.instagram.com/chaos_decorlabs/"
       target="_blank" rel="noopener">
      <span class="espera-icone" aria-hidden="true">
        <svg viewBox="0 0 24 24">
          <rect x="3" y="3" width="18" height="18" rx="5"/>
          <circle cx="12" cy="12" r="4"/>
          <circle cx="17.2" cy="6.8" r="1.1" fill="currentColor" stroke="none"/>
        </svg>
      </span>
      Novidades no Instagram
    </a>

    <p class="espera-arroba">@chaos_decorlabs</p>
  </main>

  <!-- Sem CNPJ aqui: esta tela não vende nada, então não é a página que
       o Decreto 7.962/2013 cobra. Quando a loja abrir, a identificação
       volta a aparecer no rodapé das páginas de venda. -->

</body>
</html>
