<!doctype html>
<!--
  CHAOS DECOS LABS — ABA PRODUTOS
  ────────────────────────────────
  Segue o layout que você desenhou: título "Produtos" + contagem,
  barra de filtros dividida (tópicos | valor), e a grade de 4
  colunas com foto que troca no hover, coleção, nome e preço.

  O catálogo fica em chaos-dados.js  →  const PRODUTOS
  O visual fica em chaos-loja.css
-->
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Produtos — Chaos Decos Labs</title>
  <meta name="theme-color" content="#F0E4D0" />
  <link rel="stylesheet" href="chaos-loja.css">
</head>
<body>

  <header class="site-header" id="cabecalho"></header>

  <!-- ── TÍTULO + CONTAGEM ── -->
  <section class="page-head">
    <div class="breadcrumb">
      <span class="icon"></span>
      <span>›</span>
      <b>Todos os Produtos</b>
    </div>
    <h1 class="page-title">Produtos</h1>
    <p class="page-count" id="contagem"></p>
  </section>

  <!-- ── BARRA DE FILTROS (tópicos | valor) ── -->
  <div class="filter-bar">
    <button class="filter-half" id="btnFiltro" aria-expanded="false">
      <span>Filtrar <span class="count" id="filtroCount"></span></span>
      <span class="chevron"></span>
    </button>
    <button class="filter-half" id="btnOrdem" aria-expanded="false">
      <span id="ordemRotulo">Ordenar por</span>
      <span class="chevron"></span>
    </button>

    <div class="filter-drawer" id="gavetaFiltro">
      <div class="filter-drawer-inner" id="chipsCategoria"></div>
    </div>
    <div class="filter-drawer" id="gavetaOrdem">
      <div class="filter-drawer-inner" id="chipsOrdem"></div>
    </div>
  </div>

  <!-- ── GRADE DE PRODUTOS ── -->
  <main class="product-grid" id="grade"></main>

  <footer class="site-footer" id="rodape"></footer>

  <script src="chaos-dados.js"></script>
  <script>
    montarCabecalho('produtos');
    montarRodape();

    document.querySelector('.breadcrumb .icon').innerHTML = ICONES.casa;

    /* ── Estado dos filtros ──────────────────────────────────
       Se a pessoa chegou clicando numa categoria do carrossel da
       home (produtos.html?cat=Luminárias), o filtro já abre nela. */
    const categorias = [...new Set(PRODUTOS.map((p) => p.categoria))];
    const catDaURL = new URLSearchParams(location.search).get('cat');
    let categoriaAtiva = categorias.includes(catDaURL) ? catDaURL : null;
    let ordemAtiva = 'destaque';

    /* Ordenar por preço só aparece quando há preço na tela. */
    const ORDENS = [
      { id:'destaque',    rotulo:'Destaques' },
      { id:'menor-preco', rotulo:'Menor preço', soComPreco:true },
      { id:'maior-preco', rotulo:'Maior preço', soComPreco:true },
      { id:'nome',        rotulo:'Nome (A–Z)',  soComNome:true },
    ].filter((o) => !(o.soComPreco && emBreve() && MODO_EM_BREVE.esconderPreco)
                 && !(o.soComNome  && emBreve() && MODO_EM_BREVE.esconderNome));

    /* ── Gavetas de filtro ── */
    document.getElementById('chipsCategoria').innerHTML =
      `<button class="chip ${categoriaAtiva ? '' : 'is-on'}" data-cat="">Todas</button>` +
      categorias.map((c) => `<button class="chip ${c === categoriaAtiva ? 'is-on' : ''}" data-cat="${c}">${c}</button>`).join('');

    document.getElementById('chipsOrdem').innerHTML =
      ORDENS.map((o) => `<button class="chip ${o.id === 'destaque' ? 'is-on' : ''}" data-ordem="${o.id}">${o.rotulo}</button>`).join('');

    function alternarGaveta(botao, gaveta, outroBotao, outraGaveta){
      const abrir = !gaveta.classList.contains('is-open');
      outraGaveta.classList.remove('is-open');
      outroBotao.classList.remove('is-open');
      outroBotao.setAttribute('aria-expanded', 'false');
      gaveta.classList.toggle('is-open', abrir);
      botao.classList.toggle('is-open', abrir);
      botao.setAttribute('aria-expanded', String(abrir));
    }

    const btnFiltro = document.getElementById('btnFiltro');
    const btnOrdem = document.getElementById('btnOrdem');
    const gavetaFiltro = document.getElementById('gavetaFiltro');
    const gavetaOrdem = document.getElementById('gavetaOrdem');

    btnFiltro.addEventListener('click', () => alternarGaveta(btnFiltro, gavetaFiltro, btnOrdem, gavetaOrdem));
    btnOrdem.addEventListener('click', () => alternarGaveta(btnOrdem, gavetaOrdem, btnFiltro, gavetaFiltro));

    document.getElementById('chipsCategoria').addEventListener('click', (e) => {
      const chip = e.target.closest('.chip');
      if (!chip) return;
      categoriaAtiva = chip.dataset.cat || null;
      document.querySelectorAll('#chipsCategoria .chip').forEach((c) => c.classList.toggle('is-on', c === chip));
      renderizarGrade();
    });

    document.getElementById('chipsOrdem').addEventListener('click', (e) => {
      const chip = e.target.closest('.chip');
      if (!chip) return;
      ordemAtiva = chip.dataset.ordem;
      document.querySelectorAll('#chipsOrdem .chip').forEach((c) => c.classList.toggle('is-on', c === chip));
      document.getElementById('ordemRotulo').textContent =
        'Ordenar: ' + ORDENS.find((o) => o.id === ordemAtiva).rotulo;
      renderizarGrade();
    });

    /* ── Grade ── */
    function renderizarGrade(){
      let lista = categoriaAtiva ? PRODUTOS.filter((p) => p.categoria === categoriaAtiva) : [...PRODUTOS];

      if (ordemAtiva === 'menor-preco') lista.sort((a, b) => a.preco - b.preco);
      if (ordemAtiva === 'maior-preco') lista.sort((a, b) => b.preco - a.preco);
      if (ordemAtiva === 'nome')        lista.sort((a, b) => a.nome.localeCompare(b.nome, 'pt-BR'));

      document.getElementById('contagem').textContent =
        lista.length + (lista.length === 1 ? ' produto' : ' produtos');
      document.getElementById('filtroCount').textContent = categoriaAtiva ? '(1)' : '';

      document.getElementById('grade').innerHTML = lista.map((p) => `
        <a class="product-card" href="${linkProduto(p.id)}" data-id="${p.id}">
          <div class="product-media">
            ${arteHTML(p, { classe:'art-front' })}
            ${arteHTML(p, { classe:'art-back', segunda:true })}
            ${emBreve() ? '<span class="product-flag is-breve">Em breve</span>' : flagHTML(p)}
            ${emBreve() ? '' : `
              <button class="wish-btn ${FAVORITAS.includes(p.id) ? 'is-on' : ''}" data-wish="${p.id}"
                      aria-label="Favoritar ${p.nome}"><span class="icon">${ICONES.coracao}</span></button>`}
          </div>
          <div class="product-info">
            <span class="product-collection">${p.colecao}</span>
            <div class="product-line">
              <h2 class="product-name">${nomeExibido(p)}</h2>
              <span class="product-price"><b>${precoExibido(p)}</b>${emBreve() ? '' : '<small>Sem frete</small>'}</span>
            </div>
          </div>
        </a>
      `).join('');
    }

    /* Favoritar direto no card (nesta maquete só muda o coração e o contador do topo) */
    document.getElementById('grade').addEventListener('click', (e) => {
      const botao = e.target.closest('.wish-btn');
      if (!botao) return;
      e.preventDefault();
      const id = botao.dataset.wish;
      const posicao = FAVORITAS.indexOf(id);
      if (posicao >= 0) FAVORITAS.splice(posicao, 1); else FAVORITAS.push(id);
      salvarEstado();
      botao.classList.toggle('is-on', posicao < 0);
      montarCabecalho('produtos');
    });

    renderizarGrade();
  </script>
</body>
</html>
