<!doctype html>
<!--
  CHAOS DECOS LABS — CARRINHO
  ────────────────────────────
  Lista das peças + painel de resumo fixo ao lado.

  DECISÕES QUE VOCÊ CONFERE ANTES DE PUBLICAR:
  - O subtotal é a soma dos preços das peças, SEM frete e ANTES
    de imposto — igual ao "sem frete" que você marcou no layout.
  - O frete aparece como "calculado no checkout", não como grátis:
    prometer frete grátis sem ter calculado come margem.
  - O prazo de produção sob demanda está declarado no resumo.
    Isso não é enfeite: peça impressa sob encomenda tem que
    mostrar prazo, senão o anúncio vira promessa que não cumpre.
-->
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Carrinho — Chaos Decos Labs</title>
  <meta name="theme-color" content="#F0E4D0" />
  <link rel="stylesheet" href="chaos-loja.css">
</head>
<body>

  <header class="site-header" id="cabecalho"></header>

  <section class="page-head">
    <div class="breadcrumb">
      <span class="icon"></span>
      <span>›</span>
      <b>Carrinho</b>
    </div>
    <h1 class="page-title">Carrinho</h1>
    <p class="page-count" id="contagem"></p>
  </section>

  <main class="wrap" id="conteudo"></main>

  <footer class="site-footer" id="rodape"></footer>

  <script src="chaos-dados.js"></script>
  <script>
    montarCabecalho('carrinho');
    montarRodape();

    document.querySelector('.breadcrumb .icon').innerHTML = ICONES.casa;

    function renderizar(){
      const conteudo = document.getElementById('conteudo');
      const linhas = CARRINHO
        .map((i, indice) => ({ ...i, indice, produto: acharProduto(i.id) }))
        .filter((l) => l.produto);
      const pecas = linhas.reduce((s, l) => s + l.qtd, 0);
      const subtotal = linhas.reduce((s, l) => s + l.produto.preco * l.qtd, 0);

      document.getElementById('contagem').textContent =
        pecas + (pecas === 1 ? ' peça' : ' peças');

      if (!linhas.length){
        conteudo.className = 'empty-state';
        conteudo.innerHTML = `
          <h2>Seu carrinho está vazio</h2>
          <p>Escolha uma peça e ela aparece aqui.</p>
          <a class="btn btn-primary" href="produtos.html">Ver produtos</a>
        `;
        return;
      }

      conteudo.className = 'wrap cart-layout';
      conteudo.innerHTML = `
        <div class="cart-list">
          ${linhas.map((l) => `
            <div class="cart-row">
              <a class="cart-thumb" href="${linkProduto(l.id)}" aria-label="Ver ${l.produto.nome}">${arteHTML(l.produto)}</a>
              <div>
                <h2 class="cart-row-name"><a href="${linkProduto(l.id)}">${l.produto.nome}</a></h2>
                <p class="cart-row-meta">
                  ${l.produto.colecao} · ${l.produto.categoria}
                  ${l.cor && CORES_FILAMENTO[l.cor] ? `
                    <span class="cart-cor">
                      <i style="--amostra:${CORES_FILAMENTO[l.cor].hex}"></i>${CORES_FILAMENTO[l.cor].nome}
                    </span>` : ''}
                </p>
                <button class="cart-row-remove" data-remove="${l.indice}">Remover</button>
              </div>
              <div class="cart-right">
                <div class="qty">
                  <button data-menos="${l.indice}" aria-label="Diminuir quantidade">−</button>
                  <span>${l.qtd}</span>
                  <button data-mais="${l.indice}" aria-label="Aumentar quantidade">+</button>
                </div>
                <span class="cart-row-price">${precoBR(l.produto.preco * l.qtd)}</span>
              </div>
            </div>
          `).join('')}
        </div>

        <aside class="cart-summary">
          <h2>Resumo</h2>
          <div class="summary-line"><span>Peças</span><b>${pecas}</b></div>
          <div class="summary-line"><span>Subtotal</span><b>${precoBR(subtotal)}</b></div>
          <div class="summary-line"><span>Frete</span><b>Calculado pelo seu CEP</b></div>
          <div class="summary-total">
            <span>Total</span>
            <b>${precoBR(subtotal)}</b>
          </div>
          <p class="summary-parcela">ou ${chamadaParcelamento(subtotal)}</p>
          <p class="summary-note">
            Valor sem frete. Peças impressas sob encomenda: produção em 3 a 5 dias
            úteis após a confirmação do pagamento, mais o prazo de envio.
          </p>

          <!-- Decreto 7.962/2013, art. 4º e 5º: antes de fechar, o consumidor
               tem que ver o resumo do que está contratando e saber como
               desistir. Não é letra miúda escondida no rodapé. -->
          <p class="summary-terms">
            Ao finalizar você concorda com os
            <a href="politicas.html#termos">termos de uso</a> e com a
            <a href="politicas.html#privacidade">política de privacidade</a>.
            Compra pela internet tem <b>${EMPRESA.arrependimento} dias</b> de
            <a href="politicas.html#arrependimento">direito de arrependimento</a>,
            com frete de retorno por nossa conta.
          </p>

          <!-- O pedido fecha pelo WhatsApp: o site monta o texto, você
               confere o CEP, calcula o frete e devolve o link da
               InfinitePay com o total exato. -->
          <a class="btn btn-primary btn-block" id="btnPedido"
             href="${linkPedidoWhatsApp(linhas, subtotal) || EMPRESA.whatsappLink}"
             target="_blank" rel="noopener">Fechar pedido pelo WhatsApp</a>
          <p class="summary-como">Você recebe o valor do frete e o link de pagamento
             na conversa, antes de pagar qualquer coisa.</p>
          <a class="btn btn-block" href="produtos.html">Continuar comprando</a>
        </aside>
      `;
    }

    document.getElementById('conteudo').addEventListener('click', (e) => {
      /* As linhas são identificadas pela POSIÇÃO no carrinho, não pelo id
         da peça: a mesma peça pode aparecer duas vezes em cores diferentes. */
      const mais = e.target.closest('[data-mais]');
      const menos = e.target.closest('[data-menos]');
      const remover = e.target.closest('[data-remove]');

      if (mais){
        const linha = CARRINHO[Number(mais.dataset.mais)];
        if (linha) linha.qtd += 1;
      }

      if (menos){
        const i = Number(menos.dataset.menos);
        const linha = CARRINHO[i];
        if (linha && linha.qtd > 1) linha.qtd -= 1;
        else if (linha) CARRINHO.splice(i, 1);
      }

      if (remover) CARRINHO.splice(Number(remover.dataset.remove), 1);

      if (mais || menos || remover){
        salvarEstado();
        renderizar();
        montarCabecalho('carrinho');
      }
    });

    /* Plano B: enquanto EMPRESA.whatsappE164 estiver vazio, o link curto
       abre a conversa mas não leva o pedido escrito. Nesse caso copiamos
       o texto para a área de transferência e avisamos o cliente. */
    document.getElementById('conteudo').addEventListener('click', (e) => {
      const botao = e.target.closest('#btnPedido');
      if (!botao || EMPRESA.whatsappE164) return;

      const linhas = CARRINHO
        .map((i, indice) => ({ ...i, indice, produto: acharProduto(i.id) }))
        .filter((l) => l.produto);
      const subtotal = linhas.reduce((s, l) => s + l.produto.preco * l.qtd, 0);

      const texto = textoDoPedido(linhas, subtotal);
      if (navigator.clipboard) navigator.clipboard.writeText(texto).catch(() => {});
      botao.textContent = 'Pedido copiado — é só colar na conversa';
      window.setTimeout(() => { botao.textContent = 'Fechar pedido pelo WhatsApp'; }, 3000);
    });

    renderizar();
  </script>
</body>
</html>
