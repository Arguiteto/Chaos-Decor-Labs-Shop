<!doctype html>
<!--
  CHAOS DECOS LABS — CARRINHO
  ────────────────────────────
  Lista das peças + painel de resumo fixo ao lado.

  DECISÕES QUE VOCÊ CONFERE ANTES DE PUBLICAR:
  - O subtotal é a soma dos preços das peças, SEM frete e ANTES
    de imposto — igual ao "sem frete" que você marcou no layout.
  - O frete aparece como "calculado no checkout", não como grátis:
    prometer frete grátis sem ter calculado come margem.
  - O prazo de produção sob demanda está declarado no resumo.
    Isso não é enfeite: peça impressa sob encomenda tem que
    mostrar prazo, senão o anúncio vira promessa que não cumpre.
-->
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Carrinho — Chaos Decos Labs</title>
  <meta name="theme-color" content="#F0E4D0" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="chaos-loja.css">
</head>
<body>

  <header class="site-header" id="cabecalho"></header>

  <section class="page-head">
    <div class="breadcrumb">
      <span class="icon"></span>
      <span>›</span>
      <b>Carrinho</b>
    </div>
    <h1 class="page-title">Carrinho</h1>
    <p class="page-count" id="contagem"></p>
  </section>

  <main class="wrap" id="conteudo"></main>

  <footer class="site-footer" id="rodape"></footer>

  <script src="chaos-dados.js"></script>
  <script>
    montarCabecalho('carrinho');
    montarRodape();

    document.querySelector('.breadcrumb .icon').innerHTML = ICONES.casa;

    function renderizar(){
      const conteudo = document.getElementById('conteudo');
      const linhas = CARRINHO.map((i) => ({ ...i, produto: acharProduto(i.id) })).filter((l) => l.produto);
      const pecas = linhas.reduce((s, l) => s + l.qtd, 0);
      const subtotal = linhas.reduce((s, l) => s + l.produto.preco * l.qtd, 0);

      document.getElementById('contagem').textContent =
        pecas + (pecas === 1 ? ' peça' : ' peças');

      if (!linhas.length){
        conteudo.className = 'empty-state';
        conteudo.innerHTML = `
          <h2>Seu carrinho está vazio</h2>
          <p>Escolha uma peça e ela aparece aqui.</p>
          <a class="btn btn-primary" href="produtos.html">Ver produtos</a>
        `;
        return;
      }

      conteudo.className = 'wrap cart-layout';
      conteudo.innerHTML = `
        <div class="cart-list">
          ${linhas.map((l) => `
            <div class="cart-row">
              <div class="cart-thumb">${arteHTML(l.produto)}</div>
              <div>
                <h2 class="cart-row-name">${l.produto.nome}</h2>
                <p class="cart-row-meta">${l.produto.colecao} · ${l.produto.categoria}</p>
                <button class="cart-row-remove" data-remove="${l.id}">Remover</button>
              </div>
              <div class="cart-right">
                <div class="qty">
                  <button data-menos="${l.id}" aria-label="Diminuir quantidade">−</button>
                  <span>${l.qtd}</span>
                  <button data-mais="${l.id}" aria-label="Aumentar quantidade">+</button>
                </div>
                <span class="cart-row-price">${precoBR(l.produto.preco * l.qtd)}</span>
              </div>
            </div>
          `).join('')}
        </div>

        <aside class="cart-summary">
          <h2>Resumo</h2>
          <div class="summary-line"><span>Peças</span><b>${pecas}</b></div>
          <div class="summary-line"><span>Subtotal</span><b>${precoBR(subtotal)}</b></div>
          <div class="summary-line"><span>Frete</span><b>Calculado no checkout</b></div>
          <div class="summary-total">
            <span>Total</span>
            <b>${precoBR(subtotal)}</b>
          </div>
          <p class="summary-note">
            Valor sem frete. Peças impressas sob encomenda: produção em até 5 dias
            úteis após a confirmação, mais o prazo de envio.
          </p>
          <a class="btn btn-primary btn-block" href="#">Finalizar pedido</a>
          <a class="btn btn-block" href="produtos.html" style="margin-top:10px;">Continuar comprando</a>
        </aside>
      `;
    }

    document.getElementById('conteudo').addEventListener('click', (e) => {
      const mais = e.target.closest('[data-mais]');
      const menos = e.target.closest('[data-menos]');
      const remover = e.target.closest('[data-remove]');

      if (mais){
        const linha = CARRINHO.find((i) => i.id === mais.dataset.mais);
        if (linha) linha.qtd += 1;
      }

      if (menos){
        const linha = CARRINHO.find((i) => i.id === menos.dataset.menos);
        if (linha && linha.qtd > 1) linha.qtd -= 1;
        else if (linha) CARRINHO.splice(CARRINHO.indexOf(linha), 1);
      }

      if (remover){
        const linha = CARRINHO.find((i) => i.id === remover.dataset.remove);
        if (linha) CARRINHO.splice(CARRINHO.indexOf(linha), 1);
      }

      if (mais || menos || remover){
        renderizar();
        montarCabecalho('carrinho');
      }
    });

    renderizar();
  </script>
</body>
</html>
