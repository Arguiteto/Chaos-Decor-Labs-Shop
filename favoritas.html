<!doctype html>
<!--
  CHAOS DECOS LABS — FAVORITAS
  ─────────────────────────────
  Mesma grade da aba Produtos, só que com os itens favoritados e
  dois botões por card: mandar pro carrinho ou tirar da lista.

  As peças ficam salvas no NAVEGADOR do cliente (localStorage), sem
  banco de dados. Isso significa que a lista sobrevive a fechar a aba
  — mas você não a enxerga: o dado nunca sai do aparelho dele.

  Por isso existe o botão "Tenho interesse": é o cliente quem decide
  te mandar a lista pelo WhatsApp. É o mais perto do aviso automático
  que você anotou no layout, sem precisar de conta de usuário.
-->
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Favoritas — Chaos Decos Labs</title>
  <meta name="theme-color" content="#F0E4D0" />
  <link rel="stylesheet" href="chaos-loja.css">
</head>
<body>

  <header class="site-header" id="cabecalho"></header>

  <section class="page-head">
    <div class="breadcrumb">
      <span class="icon"></span>
      <span>›</span>
      <b>Favoritas</b>
    </div>
    <h1 class="page-title">Favoritas</h1>
    <p class="page-count" id="contagem"></p>
  </section>

  <div class="wrap" style="padding-top:clamp(18px,2.6vw,28px);">
    <p class="wish-note">
      <span class="icon"></span>
      <span>Suas favoritas ficam salvas <b>neste navegador</b>, mesmo se você fechar a aba —
        e ninguém além de você vê esta lista. Todas as peças são impressas sob encomenda; o
        prazo de produção está na página de cada uma.</span>
    </p>
  </div>

  <main id="conteudo"></main>

  <!-- O cliente decide mandar a lista: é assim que o interesse chega
       até você sem conta de usuário nem banco de dados. -->
  <div class="wrap interesse" id="avisoInteresse"></div>

  <footer class="site-footer" id="rodape"></footer>

  <script src="chaos-dados.js"></script>
  <script>
    montarCabecalho('favoritas');
    montarRodape();

    document.querySelector('.breadcrumb .icon').innerHTML = ICONES.casa;
    document.querySelector('.wish-note .icon').innerHTML = ICONES.aviso;

    function renderizar(){
      const itens = FAVORITAS.map(acharProduto).filter(Boolean);
      const conteudo = document.getElementById('conteudo');

      document.getElementById('contagem').textContent =
        itens.length + (itens.length === 1 ? ' peça salva' : ' peças salvas');

      if (!itens.length){
        conteudo.className = 'empty-state';
        conteudo.innerHTML = `
          <h2>Nenhuma peça favoritada</h2>
          <p>Toque no coração das peças que te interessaram — elas ficam salvas aqui,
             neste navegador, para você achar fácil depois.</p>
          <a class="btn btn-primary" href="produtos.html">Ver produtos</a>
        `;
        return;
      }

      conteudo.className = 'product-grid';
      conteudo.innerHTML = itens.map((p) => `
        <div class="product-card">
          <a class="product-media" href="${linkProduto(p.id)}" aria-label="Ver ${p.nome}">
            ${arteHTML(p, { classe:'art-front' })}
            ${arteHTML(p, { classe:'art-back', segunda:true })}
            ${flagHTML(p)}
          </a>
          <div class="product-info">
            <span class="product-collection">${p.colecao}</span>
            <div class="product-line">
              <h2 class="product-name">${p.nome}</h2>
              <span class="product-price"><b>${precoBR(p.preco)}</b><small>Sem frete</small></span>
            </div>
          </div>
          <div class="wish-actions">
            <button class="mini-btn" data-add="${p.id}">Add ao carrinho</button>
            <button class="mini-btn is-ghost" data-remove="${p.id}" aria-label="Remover ${p.nome} da wishlist">
              <span class="icon">${ICONES.lixeira}</span>
            </button>
          </div>
        </div>
      `).join('');

      /* Botão de interesse: só aparece quando há peças salvas. */
      const aviso = document.getElementById('avisoInteresse');
      const link = linkInteresseWhatsApp(itens);
      aviso.innerHTML = link ? `
        <a class="btn btn-primary" href="${link}" target="_blank" rel="noopener">
          Tenho interesse nestas peças
        </a>
        <p>Abre uma conversa no WhatsApp com a lista pronta. Você fala com a gente
           sobre cor, medida e prazo antes de comprar.</p>
      ` : '';
    }

    document.getElementById('conteudo').addEventListener('click', (e) => {
      const remover = e.target.closest('[data-remove]');
      const adicionar = e.target.closest('[data-add]');

      if (remover){
        const posicao = FAVORITAS.indexOf(remover.dataset.remove);
        if (posicao >= 0) FAVORITAS.splice(posicao, 1);
        salvarEstado();
        renderizar();
        montarCabecalho('favoritas');
      }

      if (adicionar){
        const id = adicionar.dataset.add;
        const linha = CARRINHO.find((i) => i.id === id);
        if (linha) linha.qtd += 1; else CARRINHO.push({ id, qtd: 1 });
        salvarEstado();
        adicionar.textContent = 'No carrinho ✓';
        adicionar.disabled = true;
        montarCabecalho('favoritas');
      }
    });

    renderizar();
  </script>
</body>
</html>
