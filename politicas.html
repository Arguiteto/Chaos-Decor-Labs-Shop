<!doctype html>
<!--
  CHAOS DECOS LABS — POLÍTICAS E INFORMAÇÕES LEGAIS
  ──────────────────────────────────────────────────
  Esta página existe por obrigação legal, não por enfeite. Ela cobre:

   · Decreto 7.962/2013 ("Lei do E-commerce"), art. 2º — identificação
     do fornecedor, características do produto, despesas adicionais,
     condições da oferta e formas de pagamento.
   · Decreto 7.962/2013, art. 4º — canal de atendimento e prazo de
     resposta de 5 dias.
   · Decreto 7.962/2013, art. 5º + CDC art. 49 — direito de
     arrependimento em 7 dias.
   · CDC art. 26 — garantia legal (30 e 90 dias).
   · LGPD (Lei 13.709/2018) — o que se coleta, por quê e como apagar.

  ⚠️ ANTES DE PUBLICAR: preencha os (XXXXX) — eles vêm de EMPRESA,
  no chaos-dados.js. E leve este texto para um advogado ou para o
  seu contador dar o aval final: aqui há um modelo bem construído,
  não uma peça jurídica revisada para o seu caso.
-->
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Políticas e informações — Chaos Decos Labs</title>
  <meta name="description" content="Entrega, trocas, devoluções, direito de arrependimento, privacidade e termos de uso da Chaos Decos Labs." />
  <meta name="theme-color" content="#F0E4D0" />
  <link rel="stylesheet" href="chaos-loja.css">
</head>
<body>

  <header class="site-header" id="cabecalho"></header>

  <section class="page-head">
    <div class="breadcrumb">
      <span class="icon"></span>
      <span>›</span>
      <b>Políticas</b>
    </div>
    <h1 class="page-title">Políticas</h1>
    <p class="page-count">Entrega · trocas · privacidade · termos</p>
  </section>

  <main class="doc-page" id="documento"></main>

  <footer class="site-footer" id="rodape"></footer>

  <script src="chaos-dados.js"></script>
  <script>
    montarCabecalho('politicas');
    montarRodape();
    document.querySelector('.breadcrumb .icon').innerHTML = ICONES.casa;

    const E = EMPRESA;

    /* Data que aparece no fim dos Termos de uso. Ela diz ao cliente QUAL
       versão das regras ele aceitou — se um dia houver divergência sobre
       uma compra antiga, é o que mostra o que valia na época.
       ⚠️ Toda vez que você mudar o texto de alguma política, atualize aqui. */
    const ATUALIZADO_EM = '29 de agosto de 2026';
    /* Peça usada como exemplo na tabela de parcelamento — pega a mais cara
       do catálogo, que é onde o parcelamento realmente é usado. */
    const EXEMPLO_PARCELA = Math.max(...PRODUTOS.map((p) => p.preco));

    const SECOES = [
      {
        id:'empresa',
        titulo:'Quem vende',
        html:`
          <p>Esta loja é operada por:</p>
          <dl class="spec-list">
            <div><dt>CNPJ</dt><dd>${E.cnpj}</dd></div>
            <div><dt>E-mail</dt><dd><a href="mailto:${E.email}">${E.email}</a></dd></div>
            <div><dt>WhatsApp</dt><dd>${whatsappHTML('Chamar no WhatsApp')}</dd></div>
          </dl>
          <p>Somos um <b>MEI</b> — microempreendedor individual. Todas as peças são
             fabricadas por nós, por impressão 3D.</p>`
      },
      {
        id:'produtos',
        titulo:'O que você está comprando',
        html:`
          <p>Todas as peças são <b>impressas em 3D sob encomenda</b>, uma a uma. Nada é
             produzido antes do pedido e nada fica parado em estoque.</p>
          <p>Na página de cada peça você encontra, antes de comprar: medidas, peso
             aproximado, material, cor disponível, prazo de produção e os cuidados de uso.
             Leia esses dados — eles são a descrição real do que será entregue.</p>
          <p><b>O que muda de uma peça para outra:</b> por ser fabricação camada a camada,
             pode haver variação de até 1 mm nas medidas e pequenas diferenças de acabamento
             entre unidades. As linhas finas na superfície são a marca do processo, não
             defeito. A cor do produto pode ficar levemente diferente da que você vê na tela,
             porque cada monitor calibra cor de um jeito.</p>
          <p><b>Avisos de uso que valem para todas as peças em PLA:</b></p>
          <ul class="care-list">
            <li>Acima de aproximadamente 55 °C o material amolece: não deixe em carro fechado nem sob sol direto.</li>
            <li>Peças de luminária acompanham componente elétrico; siga a instrução que vem junto e não use lâmpada acima da potência indicada.</li>
          </ul>`
      },
      {
        id:'pagamento',
        titulo:'Formas de pagamento',
        html:`
          <p>Aceitamos <b>${PAGAMENTO.formas.join('</b>, <b>')}</b>.</p>
          <p><b>O preço que aparece no site é o preço à vista</b> — é o que você paga no Pix
             ou no cartão de débito, sem nenhum acréscimo. O cartão de crédito tem acréscimo,
             detalhado abaixo.</p>
          <p><b>Parcelamento:</b> em até <b>${PAGAMENTO.parcelas} vezes no cartão de crédito,
             ${PAGAMENTO.repassaTaxa ? 'com juros' : 'sem juros'}</b>.
             Pix e cartão de débito são à vista.</p>
          ${PAGAMENTO.repassaTaxa ? `
          <p>Parcelar com juros <b>custa mais que o preço à vista</b>, e você tem direito de
             saber exatamente quanto. A tabela abaixo mostra, para uma peça de
             <b>${precoBR(EXEMPLO_PARCELA)}</b> à vista, o valor da parcela, o total a pagar e
             a taxa de juros efetiva — é o que manda o artigo 52 do Código de Defesa do
             Consumidor. No checkout, esses mesmos números aparecem calculados sobre o
             <b>seu</b> pedido, antes de você confirmar.</p>

          <div class="tabela-scroll">
            <table class="parcelas">
              <thead>
                <tr><th>Parcelas</th><th>Valor de cada</th><th>Total a pagar</th>
                    <th>Acréscimo</th><th>Juros a.m.</th><th>Juros a.a.</th></tr>
              </thead>
              <tbody>
                ${parcelamento(EXEMPLO_PARCELA).map((p) => `
                  <tr>
                    <td><b>${p.n}×</b>${p.n === 1 ? ' <span class="td-nota">à vista no crédito</span>' : ''}</td>
                    <td>${precoBR2(p.parcela)}</td>
                    <td>${precoBR2(p.total)}</td>
                    <td>${p.acrescimo > 0 ? '+ ' + precoBR2(p.acrescimo) : '—'}</td>
                    <td>${p.jurosMes ? p.jurosMes.toFixed(2).replace('.', ',') + '%' : '—'}</td>
                    <td>${p.jurosAno ? p.jurosAno.toFixed(1).replace('.', ',') + '%' : '—'}</td>
                  </tr>`).join('')}
              </tbody>
            </table>
          </div>
          <p class="doc-update">Percentuais válidos para o exemplo acima; os valores em reais
             mudam conforme o preço do seu pedido. <b>Pix e cartão de débito não têm
             acréscimo nenhum</b> — pagam o preço à vista.</p>
          ` : `
          <p><b>O parcelamento é sem juros para você:</b> comprar em 12× custa o mesmo que
             comprar à vista no cartão. O valor total do pedido não muda com o número de
             parcelas.</p>
          `}
          <p>Você pode quitar o parcelamento antes do fim, com redução proporcional dos juros
             (CDC, art. 52, § 2º). Multa por atraso, se houver, é limitada a 2% do valor da
             parcela (art. 52, § 1º).</p>
          <p>Os preços exibidos estão em <b>reais (R$)</b> e valem para a compra neste site.
             O frete é calculado à parte, no fechamento do pedido, e aparece antes de você
             confirmar a compra.</p>
          <p>O pedido só entra na fila de produção depois da confirmação do pagamento.</p>`
      },
      {
        id:'entrega',
        titulo:'Prazos e entrega',
        html:`
          <p>O prazo total tem <b>duas partes somadas</b>, e é assim que ele deve ser lido:</p>
          <dl class="spec-list">
            <div><dt>1. Produção</dt><dd>3 a 5 dias úteis (impressão sob encomenda)</dd></div>
            <div><dt>2. Transporte</dt><dd>prazo da transportadora, informado no fechamento</dd></div>
          </dl>
          <p>Exemplo: uma peça com 4 dias úteis de produção e 5 dias úteis de envio chega em
             torno de 9 dias úteis após a confirmação do pagamento.</p>
          <p>O prazo de produção começa a contar no primeiro dia útil após o pagamento
             confirmado. Pedidos com mais de uma peça podem levar mais tempo de produção —
             o prazo do pedido é informado antes da finalização.</p>
          <p>Enviamos o código de rastreio assim que o pedido é postado. Se algo atrasar da
             nossa parte, avisamos por e-mail ou WhatsApp antes do prazo vencer, e você pode
             escolher entre aguardar ou cancelar com reembolso integral.</p>
          <p><b>Frete:</b> o valor é calculado pelo CEP no fechamento do pedido, com o custo
             discriminado antes da confirmação. Nenhuma taxa é cobrada depois disso.</p>`
      },
      {
        id:'arrependimento',
        titulo:'Direito de arrependimento (7 dias)',
        html:`
          <p>Compra feita pela internet dá a você o <b>direito de se arrepender em até
             ${E.arrependimento} dias corridos</b>, contados do recebimento da peça, sem
             precisar justificar nada. É o artigo 49 do Código de Defesa do Consumidor.</p>
          <p><b>Como exercer:</b> escreva para <a href="mailto:${E.email}">${E.email}</a> ou
             chame no ${whatsappHTML('WhatsApp')} informando seu número de pedido. Confirmamos o
             recebimento do pedido de arrependimento imediatamente e explicamos como devolver.</p>
          <p><b>Quem paga a devolução:</b> nós. No arrependimento, o custo do frete de retorno
             é nosso.</p>
          <p><b>Reembolso:</b> devolvemos o valor integral, incluindo o frete que você pagou,
             em até 10 dias após recebermos a peça de volta. Pagamento no cartão é estornado
             pela operadora; Pix e boleto voltam por transferência.</p>
          <p><b>Condição:</b> a peça precisa voltar sem uso e na embalagem, com todos os
             componentes. Peça devolvida danificada por mau uso pode ter o reembolso ajustado.</p>`
      },
      {
        id:'trocas',
        titulo:'Trocas, defeitos e garantia',
        html:`
          <p>Isto é diferente de arrependimento: aqui a peça <b>chegou com problema</b>.</p>
          <p><b>Chegou quebrada, trocada ou diferente do anunciado:</b> nos avise em até
             7 dias corridos do recebimento, com foto. Trocamos por uma peça nova ou
             devolvemos o valor integral, como você preferir. O frete é por nossa conta nos
             dois casos.</p>
          <p><b>Garantia legal:</b> por serem produtos duráveis, as peças têm
             <b>90 dias de garantia</b> contra defeito de fabricação, contados da entrega
             (Código de Defesa do Consumidor, art. 26).</p>
          <p><b>O que a garantia não cobre:</b> queda, peso acima do uso previsto, exposição
             ao sol ou ao calor, contato com solvente, e desgaste normal.</p>
          <p>Para acionar: e-mail ou WhatsApp com o número do pedido, foto do problema e uma
             frase sobre o que aconteceu. Respondemos em até ${E.prazoResposta}.</p>`
      },
      {
        id:'encomenda',
        titulo:'Peças personalizadas',
        html:`
          <p>Peça feita sob medida para você — cor fora do catálogo, tamanho alterado, arte
             ou nome aplicado — é combinada por WhatsApp, com orçamento e prazo próprios,
             aprovados por escrito antes da produção começar.</p>
          <p>Nesse caso, avisamos antes de fechar: uma peça personalizada não pode ser
             revendida a outro cliente. Depois de aprovada e iniciada a produção, o
             cancelamento pode não ser possível — e isso é dito a você <b>antes</b> do
             pagamento, nunca depois.</p>
          <p>Defeito de fabricação continua coberto normalmente, mesmo em peça personalizada.</p>`
      },
      {
        id:'atendimento',
        titulo:'Atendimento',
        html:`
          <p>Fale com a gente por:</p>
          <dl class="spec-list">
            <div><dt>E-mail</dt><dd><a href="mailto:${E.email}">${E.email}</a></dd></div>
            <div><dt>WhatsApp</dt><dd>${whatsappHTML('Chamar no WhatsApp')}</dd></div>
          </dl>
          <p>Respondemos toda mensagem em até <b>${E.prazoResposta}</b>. Reclamação,
             cancelamento e dúvida sobre pedido podem ser feitos pelo mesmo canal em que a
             compra foi feita.</p>`
      },
      {
        id:'privacidade',
        titulo:'Privacidade (LGPD)',
        html:`
          <p>Seus dados são tratados conforme a Lei Geral de Proteção de Dados
             (Lei 13.709/2018). Em resumo honesto:</p>
          <p><b>O que coletamos:</b> nome, e-mail, telefone, CPF e endereço — só o necessário
             para emitir a nota fiscal, produzir e entregar o pedido, e falar com você sobre ele.</p>
          <p><b>Por quê:</b> para executar o contrato de compra e cumprir obrigações legais
             e fiscais. Não é escolha nossa guardar dado fiscal: a lei obriga.</p>
          <p><b>Com quem compartilhamos:</b> transportadora (para entregar), meio de pagamento
             (para cobrar) e órgãos fiscais (quando exigido por lei). <b>Não vendemos nem
             cedemos seus dados para ninguém</b> e não usamos sua informação para publicidade
             de terceiros.</p>
          <p><b>Por quanto tempo:</b> dados de pedido ficam guardados pelo prazo legal fiscal;
             o resto é apagado quando deixa de ser necessário.</p>
          <p><b>Cookies e dados no seu navegador:</b> este site não usa cookies de
             rastreamento nem ferramentas de publicidade. Ele guarda no <b>seu próprio
             navegador</b> apenas duas coisas, para a loja lembrar delas quando você voltar:
             suas <b>peças favoritas</b> e o seu <b>carrinho</b>. Esses dados ficam no seu
             aparelho, <b>não são enviados para nós</b> nem para ninguém, e você apaga
             quando quiser limpando os dados do site no navegador. Se isso mudar, esta
             página muda junto, antes.</p>
          <p><b>Seus direitos:</b> você pode pedir acesso, correção, portabilidade ou exclusão
             dos seus dados, e revogar consentimento, escrevendo para
             <a href="mailto:${E.email}">${E.email}</a>. Respondemos em até
             ${E.prazoResposta}.</p>`
      },
      {
        id:'termos',
        titulo:'Termos de uso',
        html:`
          <p>Ao comprar neste site você concorda com o que está nesta página.</p>
          <p><b>Preços e disponibilidade:</b> podem mudar a qualquer momento, mas o preço que
             vale é o que estava na tela quando você finalizou o pedido. Se houver erro
             evidente de digitação num preço, avisamos antes de produzir e você decide se
             mantém ou cancela com reembolso integral.</p>
          <p><b>Imagens:</b> as imagens são ilustrativas quanto à cor exibida na tela. Medidas,
             material e componentes são os declarados na ficha de cada peça — esses, sim, são
             o compromisso.</p>
          <p><b>Propriedade intelectual:</b> os desenhos, modelos 3D, fotos e textos desta loja
             são nossos. Comprar a peça dá a você a peça, não o direito de reproduzi-la para
             revenda.</p>
          <p><b>Foro:</b> aplica-se a lei brasileira e o Código de Defesa do Consumidor.</p>
          <p class="doc-update">Última atualização: ${ATUALIZADO_EM}.</p>`
      },
    ];

    document.getElementById('documento').innerHTML = `
      <nav class="doc-index">
        ${SECOES.map((s) => `<a href="#${s.id}">${s.titulo}</a>`).join('')}
      </nav>
      <div class="doc-body">
        ${SECOES.map((s) => `
          <section class="doc-section" id="${s.id}">
            <h2>${s.titulo}</h2>
            ${s.html}
          </section>
        `).join('')}
      </div>
    `;

    /* Destaca no índice a seção que está na tela */
    const alvos = [...document.querySelectorAll('.doc-section')];
    const links = [...document.querySelectorAll('.doc-index a')];
    const observador = new IntersectionObserver((entradas) => {
      entradas.forEach((e) => {
        if (!e.isIntersecting) return;
        links.forEach((l) => l.classList.toggle('is-on', l.getAttribute('href') === '#' + e.target.id));
      });
    }, { rootMargin: '-30% 0px -60% 0px' });
    alvos.forEach((a) => observador.observe(a));
  </script>
</body>
</html>
